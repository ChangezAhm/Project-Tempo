name: tests

on:
  push:
  pull_request:

jobs:
  parser-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parser
    env:
      # Dummy values so config/module imports succeed; the suite is offline
      # (network-touching seams are monkeypatched in the tests themselves).
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy
      STORAGE_BUCKET: template-files
      PARSER_API_KEY: ci-dummy
      ANTHROPIC_API_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install parser + test deps
        run: pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest tests -q
